<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoDraft MCP</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (location.search.indexOf('client=') < 0) {
            document.addEventListener('DOMContentLoaded', function () {
                var b = document.createElement('div');
                b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c62828;color:#fff;z-index:99999;padding:8px 12px;font:12px/1.4 sans-serif;text-align:center';
                b.textContent = 'CoDraft: tab was opened without client parameters — please close it.';
                document.body.prepend(b);
            });
        }
    </script>
    <script src="js/main.js" type="module"></script>
</head>
<body>
<div class="container">
    <header>
        <div class="header-left">
            <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="Toggle Sidebar">
                <span class="toggle-icon">☰</span>
                <span class="toggle-text" data-i18n="folders">Folders</span>
            </button>
            <h1>📌 CoDraft MCP</h1>
            <span id="app-version" class="version-badge" title="Alpha build">alpha</span>
        </div>
    </header>

    <!-- Plans Dashboard -->
    <div id="view-plans" class="view">
        <div class="dashboard-layout">
            <div id="sidebar-overlay" class="sidebar-overlay"></div>
            <aside id="folders-sidebar" class="folders-sidebar">
                <div class="sidebar-header">
                    <h3 id="sidebar-title" data-i18n="foldersTitle">📁 Folders</h3>
                    <button id="btn-add-folder" class="btn-secondary-sm" data-i18n="newFolder">+ New Folder</button>
                </div>
                <div id="folder-list" class="folder-list"></div>
            </aside>
            <main class="plans-main-content">
                <div id="folder-tabs" class="folder-tabs" style="display:none;"></div>
                <div id="plans-grid" class="plans-grid">
                    <div class="loading" data-i18n="loadingPlans">Loading plans...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Plan Detail -->
    <div id="view-plan-detail" class="view" style="display:none;">
        <div id="plan-detail-content"></div>
    </div>

    <!-- Debug & Session Footer -->
    <footer class="app-footer">
        <div class="footer-debug-info">
            <div id="session-info" class="session-info"></div>
            <div class="footer-controls">
                <div class="selector-group">
                    <label for="select-lang" data-i18n="langLabel">Lang:</label>
                    <select id="select-lang" class="header-select">
                        <option value="en">EN</option>
                        <option value="ru">RU</option>
                        <option value="tm">TM</option>
                    </select>
                </div>
                <span id="ws-status" class="status-badge offline" data-i18n="wsOffline">WebSocket: Offline</span>
                <div class="selector-group">
                    <label for="select-loglevel" data-i18n="logLevelLabel">Log Level:</label>
                    <select id="select-loglevel" class="header-select">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARN">WARN</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                </div>
            </div>
        </div>
    </footer>
</div>

<!-- Modal Overlay for Confirmations & Inputs -->
<div id="app-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
    </div>
</div>
</body>
</html>
